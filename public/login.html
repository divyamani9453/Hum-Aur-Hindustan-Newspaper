<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form id="LoginForm">
       <input
       type="email",
       id="email",
       placeholder="email",
       required>

       <br><br>
       <input 
       type="password",
       id="password",
       placeholder="password",
       required>


       <br><br>
       <button type="submit">Login</button>

       </form>

       <P>Don't have an account? 
        <a href="register.html">Register here</a>
        </P>

        <script src="login.js"></script>
    
</body>
</html>
